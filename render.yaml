services:
  - type: web
    name: infinite-theater
    runtime: node
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    envVars:
      - key: NODE_ENV
        value: production
