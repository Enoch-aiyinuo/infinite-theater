services:
  - type: web
    name: infinite-theater
    runtime: node
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildCommand: npx --yes pnpm@10.4.1 install --frozen-lockfile && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
